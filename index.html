<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro — Learning Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="appShell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>pomodoro</h1>
      </div>
      <nav class="view-switch" id="mainNav" aria-label="Main views">
        <button id="viewTimer" class="view-btn active" data-view="timer">Timer</button>
        <button id="viewDashboard" class="view-btn" data-view="dashboard">Dashboard</button>
        <button id="viewCalendar" class="view-btn" data-view="calendar">Calendar</button>
        <button id="viewLibrary" class="view-btn" data-view="library">Library</button>
        <button id="viewHistory" class="view-btn" data-view="history">History</button>
        <button id="viewAnalytics" class="view-btn" data-view="analytics">Analytics</button>
      </nav>
    </header>

    <!-- TIMER VIEW -->
    <main id="timerView" class="view">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="pomodoro">Pomodoro</button>
        <button class="mode-tab" data-mode="short">Short break</button>
        <button class="mode-tab" data-mode="long">Long break</button>
      </div>

      <div class="task-input">
        <input type="text" id="taskInput" placeholder="What are you focusing on?" maxlength="80">
      </div>

      <div class="focus-link-row">
        <label class="focus-link-label" for="focusLink">Link to</label>
        <select id="focusLink" class="text-input focus-link-select">
          <option value="">No course, book, or task</option>
        </select>
        <button id="clearEventContext" class="btn btn-ghost btn-sm hidden">Clear event</button>
      </div>
      <div id="focusContextBadge" class="focus-context hidden"></div>

      <div class="timer-wrap">
        <svg class="ring" viewBox="0 0 340 340">
          <circle class="ring-bg" cx="170" cy="170" r="150"></circle>
          <circle class="ring-fg" cx="170" cy="170" r="150"></circle>
        </svg>
        <div class="timer-center">
          <div id="timeDisplay" class="time">25:00</div>
          <div id="sessionLabel" class="session-label">Ready</div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start</button>
        <button id="resetBtn" class="btn btn-ghost">Reset</button>
        <button id="skipBtn" class="btn btn-ghost">Skip</button>
      </div>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-value" id="cycleCount">0</span>
          <span class="stat-label">of 4 pomodoros</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="todayHours">0h 0m</span>
          <span class="stat-label">today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="totalHours">0h 0m</span>
          <span class="stat-label">total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="streakCount">0</span>
          <span class="stat-label">day streak</span>
        </div>
      </div>
    </main>

    <!-- DASHBOARD VIEW -->
    <main id="dashboardView" class="view hidden">
      <div class="section-head page-head">
        <div>
          <h2>Dashboard</h2>
          <span id="dashboardDate" class="page-subtitle"></span>
        </div>
        <button id="dashboardCalendarBtn" class="btn btn-ghost btn-sm">Open calendar</button>
      </div>
      <div id="dashboardContent" class="dashboard-content"></div>
    </main>

    <!-- CALENDAR VIEW -->
    <main id="calendarView" class="view hidden">
      <div class="section-head page-head">
        <div>
          <h2>Calendar</h2>
          <span id="calendarSubtitle" class="page-subtitle"></span>
        </div>
        <div class="head-actions">
          <button id="autoScheduleBtn" class="btn btn-ghost btn-sm">Auto schedule</button>
          <button id="addEventBtn" class="btn btn-primary btn-sm">+ Session</button>
        </div>
      </div>
      <div id="calendarToolbar" class="calendar-toolbar"></div>
      <div id="calendarFilters" class="calendar-filters"></div>
      <div id="calendarBody" class="calendar-body"></div>
      <section class="unscheduled-section">
        <div class="section-head">
          <h2>Unscheduled learning</h2>
        </div>
        <div id="unscheduledList" class="unscheduled-list"></div>
      </section>
    </main>

    <!-- LIBRARY VIEW -->
    <main id="libraryView" class="view hidden">
      <div class="section-head page-head">
        <div>
          <h2>Learning library</h2>
          <span id="librarySubtitle" class="page-subtitle"></span>
        </div>
        <button id="addLearningBtn" class="btn btn-primary btn-sm">+ New course</button>
      </div>
      <div id="learningTabs"></div>
      <div id="libraryContent"></div>
    </main>

    <!-- HISTORY VIEW -->
    <main id="historyView" class="view hidden">
      <section class="summary">
        <div class="summary-card">
          <span class="summary-label">Total focus</span>
          <span class="summary-value" id="sumTotal">0h 0m</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Today</span>
          <span class="summary-value" id="sumToday">0h 0m</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">This week</span>
          <span class="summary-value" id="sumWeek">0h 0m</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Sessions</span>
          <span class="summary-value" id="sumCount">0</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">Current streak</span>
          <span class="summary-value" id="sumStreak">0 🔥</span>
        </div>
      </section>

      <section class="chart-section">
        <div class="section-head">
          <h2>Last 7 days</h2>
        </div>
        <div id="chart" class="chart"></div>
      </section>

      <section class="list-section">
        <div class="section-head">
          <h2>Session log</h2>
          <div class="list-actions">
            <button id="exportCsv" class="btn btn-ghost btn-sm">CSV</button>
            <button id="exportJson" class="btn btn-ghost btn-sm">JSON</button>
            <button id="clearAll" class="btn btn-danger btn-sm">Clear</button>
          </div>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>
    </main>

    <!-- ANALYTICS VIEW -->
    <main id="analyticsView" class="view hidden">
      <div class="section-head page-head">
        <div>
          <h2>Analytics</h2>
          <span id="analyticsSubtitle" class="page-subtitle"></span>
        </div>
        <div class="range-switch" id="analyticsRange">
          <button class="range-btn active" data-range="7">7 days</button>
          <button class="range-btn" data-range="30">30 days</button>
        </div>
      </div>
      <div id="analyticsContent" class="analytics-content"></div>
    </main>

    <footer class="footer">
      <span>Space = start/pause · R = reset</span>
    </footer>
  </div>

  <div id="plannerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
